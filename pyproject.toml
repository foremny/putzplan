[project]
name = "putzliste"
version = "0.1.0"
description = "Cleaning plan integration for Home Assistant, plus the printable PDF checklist"
requires-python = ">=3.13"
dependencies = [
    "reportlab>=4.5",
]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
